plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenLocal()
    maven {
        name = "Curse Maven"
        url "https://cursemaven.com"
    }
    maven {
        name = "GeckoLib"
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        name = "Local libs"
        url = uri("${projectDir}/libs")
    }
}

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll([
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing-mod', 'portlib',
                    '--existing-mod', 'lyra'
            ])
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 源码含中文字面量与中文注释，强制以 UTF-8 编译，避免在 GBK 默认编码的控制台上出现乱码/不可映射字符。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

dependencies {
    // 独立库 mod Lyra (first.lyra.*) —— 1.20.1 / Forge 版本
    modImplementation("first:Lyra-1201:${lyra_version}")

    // PortLib：把 NeoForge 的事件 / 注册 / 附件 / 网络接口带到 Forge 1.20.1
    modImplementation("org.mesdag:PortLib:${portlib_version}")
    interfaceInjectionData("org.mesdag:PortLib:${portlib_version}")
    jarJar("org.mesdag:PortLib:${portlib_version}")

    // GeckoLib 由 Lyra 传递引入，此处显式声明以保证 dev 环境可解析
    modImplementation("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.3"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

// Minecraft's vanilla model bakery reads standalone JSON models from "models/".
// Lyra keeps the source convention under "lyra_model/json/"; mirror it at build time.
tasks.named('processResources', ProcessResources).configure {
    from("src/main/resources/assets/${mod_id}/lyra_model/json") {
        include '**/*.json'
        into "assets/${mod_id}/models/lyra_model/json"
    }
    from("src/main/resources/assets/${mod_id}/lyra_model/json") {
        include '**/*.png'
        into "assets/${mod_id}/textures/lyra_model/json"
    }
    from("src/main/resources/assets/${mod_id}/lyra_model/textures") {
        into "assets/${mod_id}/textures/lyra_model/textures"
    }
}

// Expands Forge metadata before it enters the resources.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            portlib_version        : portlib_version,
            geckolib_version       : geckolib_version,
            lyra_version           : lyra_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
